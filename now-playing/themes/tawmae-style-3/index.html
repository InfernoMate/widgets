<div id="main-wrapper">
    <!-- Unscharfer Hintergrund -->
    <div class="cover-blur" id="cover-bg"></div>
    <div class="overlay-dark"></div>
    
    <div class="content">
        <div class="text-mask" id="title-wrapper">
            <h2 class="title" id="song-title">Warte auf Medien...</h2>
        </div>
        <div class="text-mask" id="artist-wrapper">
            <p class="artist" id="song-artist"></p>
        </div>
        
        <div class="progress-container" id="progress-container">
            <span class="time current-time" id="current-time">0:00</span>
            <div class="progress-bar">
                <div class="track-line" id="track-line"></div>
                <div class="visualizer" id="visualizer"></div>
                <div class="knob" id="knob"></div>
            </div>
            <span class="time total-time" id="total-time">0:00</span>
        </div>
    </div>
</div>
