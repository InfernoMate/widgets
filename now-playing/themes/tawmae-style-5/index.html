<div id="main-wrapper" class="container">
    <div class="cover-side">
        <div class="cover-img" id="cover-img"></div>
    </div>

    <div class="info-side" id="info-side">
        <div class="title-row">
            <div class="text-mask" id="title-wrapper">
                <h2 class="song-title" id="song-title">Warte auf Medien...</h2>
            </div>
            <span class="explicit-badge" id="explicit-badge" style="display: none">E</span>
        </div>
        
        <div class="text-mask" id="artist-wrapper">
            <p class="song-artist" id="song-artist"></p>
        </div>
        
        <div class="text-mask" id="album-wrapper">
            <p class="song-album" id="song-album"></p>
        </div>

        <div id="progress-container" class="progress-section">
            <div class="progress-track">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="progress-knob" id="progress-knob"></div>
            <div class="progress-times">
                <span id="current-time">0:00</span>
                <span id="total-time">0:00</span>
            </div>
        </div>
    </div>
</div>
